product: pcb            # name shown to the operator and used in the log

detector:
  backbone: resnet18   # small enough for Pi 5 CPU; try wide_resnet50_2 on laptop for accuracy comparison
  layers: [layer2, layer3]
  image_size: 320      # 224 -> 320 raised pcb1 image AUROC 0.900 -> 0.972 (laptop sweep, 2026-10-16)
  coreset_ratio: 0.01
  threshold_percentile: 99.0
  blur_sigma: 4.0

severity:
  minor_area_pct: 0.5
  major_area_pct: 3.0
  critical_score: 2.0

llama:
  # Llama 3.2 1B Instruct exported with ExecuTorch (docs/executorch_llama.md).
  # Until the files exist the app runs with a clearly-labelled rule-based fallback.
  runtime: python      # python = ExecuTorch TextLLMRunner in-process; binary = llama_main subprocess
  model: models/llama3_2_1b_8da4w.pte
  tokenizer: models/llama3_2_1b/tokenizer.model
  runner: null         # only for runtime: binary, path to llama_main
  max_seq_len: 768
  max_new_tokens: 160
  temperature: 0.2

log_db: outputs/inspections.sqlite
